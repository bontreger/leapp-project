---
- name: Build and Install Leapp Supplements RPM
  hosts: all
  become: yes
  vars:
    leapp_supplements_dir: /tmp/leapp-supplements
  tasks:
    - name: Install prerequisites for RHEL 7
      ansible.builtin.yum:
        name:
          - git
          - make
          - rpm-build
          - python2-devel
        state: present
      when: ansible_distribution_major_version | int == 7

    - name: Install prerequisites for RHEL 8 and 9
      ansible.builtin.dnf:
        name:
          - git
          - make
          - rpm-build
          - python3-devel
        state: present
      when: ansible_distribution_major_version | int in [8, 9]

    - name: Clone leapp-supplements repository
      ansible.builtin.git:
        repo: https://github.com/oamg/leapp-supplements.git
        dest: "{{ leapp_supplements_dir }}"
        version: main
      register: git_result

    - name: Build RPM for RHEL 7->8 upgrade
      ansible.builtin.shell:
        cmd: make rpmbuild DIST_VERSION=7
        chdir: "{{ leapp_supplements_dir }}"
      when: ansible_distribution_major_version | int == 7
      register: build_result_7

    - name: Build RPM for RHEL 8->9 upgrade
      ansible.builtin.shell:
        cmd: make rpmbuild DIST_VERSION=8
        chdir: "{{ leapp_supplements_dir }}"
      when: ansible_distribution_major_version | int == 8
      register: build_result_8

    - name: Build RPM for RHEL 9 (using DIST_VERSION=8)
      ansible.builtin.shell:
        cmd: make rpmbuild DIST_VERSION=8
        chdir: "{{ leapp_supplements_dir }}"
      when: ansible_distribution_major_version | int == 9
      register: build_result_9

    - name: Find generated RPM for RHEL 7
      ansible.builtin.find:
        paths: "{{ leapp_supplements_dir }}"
        patterns: "*.noarch.rpm"
        file_type: file
      register: rpm_files_7
      when: ansible_distribution_major_version | int == 7

    - name: Find generated RPM for RHEL 8 and 9
      ansible.builtin.find:
        paths: "{{ leapp_supplements_dir }}"
        patterns: "*.noarch.rpm"
        file_type: file
      register: rpm_files_8_9
      when: ansible_distribution_major_version | int in [8, 9]

    - name: Install RPM on RHEL 7
      ansible.builtin.yum:
        name: "{{ rpm_files_7.files[0].path }}"
        state: present
      when:
        - ansible_distribution_major_version | int == 7
        - rpm_files_7.files | length > 0

    - name: Install RPM on RHEL 8 and 9
      ansible.builtin.dnf:
        name: "{{ rpm_files_8_9.files[0].path }}"
        state: present
        disable_gpg_check: yes
      when:
        - ansible_distribution_major_version | int in [8, 9]
        - rpm_files_8_9.files | length > 0
