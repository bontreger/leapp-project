---
- name: Wait for connection...
  ansible.builtin.wait_for_connection:
    connect_timeout: 20
    sleep: 5
    delay: 5
    timeout: 300

- name: Check for leapp utility
  ansible.builtin.stat:
    path: /usr/bin/leapp
  register: leapp_utility_check

- name: Add Leapp repos
  ansible.builtin.shell: |
    set -o pipefail
    leapp preupgrade --enablerepo=ripu-upgrade-rhel-10-baseos --enablerepo=ripu-upgrade-rhel-10-appstream
  args:
    executable: /bin/bash
...